description = "사용 가능한 설계 산출물을 기반으로 기능에 대한 실행 가능하고 종속성 순서가 지정된 tasks.md를 생성합니다."

prompt = """
---
description: 사용 가능한 설계 산출물을 기반으로 기능에 대한 실행 가능하고 종속성 순서가 지정된 tasks.md를 생성합니다.
handoffs: 
  - label: 일관성 분석
    agent: speckit.analyze
    prompt: 일관성을 위한 프로젝트 분석 실행
    send: true
  - label: 프로젝트 구현
    agent: speckit.implement
    prompt: 단계별로 구현 시작
    send: true
---

## 사용자 입력

```text
$ARGUMENTS
```

진행하기 전에 사용자 입력을 **반드시** 고려해야 합니다(비어 있지 않은 경우).

## 개요

1. **설정**: 리포지토리 루트에서 `.specify/scripts/bash/check-prerequisites.sh --json` (또는 Windows의 경우 `.specify/scripts/powershell/check-prerequisites.ps1 -Json`)을 실행하고 FEATURE_DIR 및 AVAILABLE_DOCS 목록을 파싱합니다. 모든 경로는 절대 경로여야 합니다. "I'm Groot"와 같은 인수의 작은따옴표는 이스케이프 구문을 사용하세요: 예: 'I'\\''m Groot' (또는 가능한 경우 큰따옴표: "I'm Groot").

2. **설계 문서 로드**: FEATURE_DIR에서 읽기:
   - **필수**: plan.md (기술 스택, 라이브러리, 구조), spec.md (우선순위가 있는 사용자 스토리)
   - **선택 사항**: data-model.md (엔티티), contracts/ (API 엔드포인트), research.md (결정), quickstart.md (테스트 시나리오)
   - 참고: 모든 프로젝트에 모든 문서가 있는 것은 아닙니다. 사용 가능한 문서를 기반으로 작업을 생성하세요.

3. **작업 생성 워크플로우 실행**:
   - plan.md를 로드하고 기술 스택, 라이브러리, 프로젝트 구조 추출
   - spec.md를 로드하고 우선순위(P1, P2, P3 등)가 있는 사용자 스토리 추출
   - data-model.md가 있는 경우: 엔티티를 추출하고 사용자 스토리에 매핑
   - contracts/가 있는 경우: 엔드포인트를 사용자 스토리에 매핑
   - research.md가 있는 경우: 설정 작업을 위한 결정 추출
   - 사용자 스토리별로 정리된 작업 생성 (아래 작업 생성 규칙 참조)
   - 사용자 스토리 완료 순서를 보여주는 종속성 그래프 생성
   - 사용자 스토리별 병렬 실행 예제 생성
   - 작업 완전성 검증 (각 사용자 스토리에 필요한 모든 작업이 있고 독립적으로 테스트 가능함)

4. **tasks.md 생성**: `.specify/templates/tasks-template.md`를 구조로 사용하여 다음을 채웁니다:
   - plan.md의 올바른 기능 이름
   - 1단계: 설정 작업 (프로젝트 초기화)
   - 2단계: 기본 작업 (모든 사용자 스토리에 대한 차단 전제 조건)
   - 3단계+: 사용자 스토리당 하나의 단계 (spec.md의 우선순위 순서)
   - 각 단계 포함: 스토리 목표, 독립적 테스트 기준, 테스트(요청된 경우), 구현 작업
   - 최종 단계: 다듬기 및 교차 관심사
   - 모든 작업은 엄격한 체크리스트 형식을 따ら야 합니다(아래 작업 생성 규칙 참조).
   - 각 작업에 대한 명확한 파일 경로
   - 스토리 완료 순서를 보여주는 종속성 섹션
   - 스토리별 병렬 실행 예제
   - 구현 전략 섹션 (MVP 우선, 점진적 전달)

5. **보고**: 생성된 tasks.md 경로 및 요약 출력:
   - 총 작업 수
   - 사용자 스토리별 작업 수
   - 식별된 병렬 기회
   - 각 스토리에 대한 독립적 테스트 기준
   - 제안된 MVP 범위 (일반적으로 사용자 스토리 1만 해당)
   - 형식 검증: 모든 작업이 체크리스트 형식(체크박스, ID, 라벨, 파일 경로)을 따르는지 확인

작업 생성 컨텍스트: {{args}}

tasks.md는 즉시 실행 가능해야 합니다. 각 작업은 LLM이 추가 컨텍스트 없이 완료할 수 있을 만큼 구체적이어야 합니다.

## 작업 생성 규칙

**중요**: 독립적인 구현 및 테스트를 가능하게 하려면 작업은 사용자 스토리별로 구성되어야 합니다.

**테스트는 선택 사항입니다**: 기능 명세서에서 명시적으로 요청하거나 사용자가 TDD 접근 방식을 요청한 경우에만 테스트 작업을 생성하세요.

### 체크리스트 형식 (필수)

모든 작업은 다음 형식을 엄격히 따라야 합니다:

```text
- [ ] [TaskID] [P?] [Story?] 파일 경로가 포함된 설명
```

**형식 구성 요소**:

1. **체크박스**: 항상 `- [ ]` (마크다운 체크박스)로 시작
2. **작업 ID**: 실행 순서대로 순차 번호 (T001, T002, T003...)
3. **[P] 마커**: 작업이 병렬화 가능한 경우에만 포함 (다른 파일, 완료되지 않은 작업에 대한 종속성 없음)
4. **[Story] 라벨**: 사용자 스토리 단계 작업에만 필수
   - 형식: [US1], [US2], [US3] 등 (spec.md의 사용자 스토리에 매핑)
   - 설정 단계: 스토리 라벨 없음
   - 기본 단계: 스토리 라벨 없음
   - 사용자 스토리 단계: 스토리 라벨 필수
   - 다듬기 단계: 스토리 라벨 없음
5. **설명**: 정확한 파일 경로가 포함된 명확한 조치

**예시**:

- ✅ 올바름: `- [ ] T001 구현 계획에 따라 프로젝트 구조 생성`
- ✅ 올바름: `- [ ] T005 [P] src/middleware/auth.py에 인증 미들웨어 구현`
- ✅ 올바름: `- [ ] T012 [P] [US1] src/models/user.py에 User 모델 생성`
- ✅ 올바름: `- [ ] T014 [US1] src/services/user_service.py에 UserService 구현`
- ❌ 틀림: `- [ ] User 모델 생성` (ID 및 스토리 라벨 누락)
- ❌ 틀림: `T001 [US1] 모델 생성` (체크박스 누락)
- ❌ 틀림: `- [ ] [US1] User 모델 생성` (작업 ID 누락)
- ❌ 틀림: `- [ ] T001 [US1] 모델 생성` (파일 경로 누락)

### 작업 구성

1. **사용자 스토리 (spec.md)에서** - 기본 구성:
   - 각 사용자 스토리(P1, P2, P3...)는 자체 단계를 갖습니다.
   - 모든 관련 구성 요소를 스토리에 매핑:
     - 해당 스토리에 필요한 모델
     - 해당 스토리에 필요한 서비스
     - 해당 스토리에 필요한 엔드포인트/UI
     - 테스트가 요청된 경우: 해당 스토리에 특정한 테스트
   - 스토리 종속성 표시 (대부분의 스토리는 독립적이어야 함)

2. **계약에서**:
   - 각 계약/엔드포인트 매핑 → 서비스를 제공하는 사용자 스토리에 매핑
   - 테스트가 요청된 경우: 각 계약 → 해당 스토리 단계에서 구현 전 계약 테스트 작업 [P]

3. **데이터 모델에서**:
   - 각 엔티티를 필요한 사용자 스토리에 매핑
   - 엔티티가 여러 스토리에 서비스를 제공하는 경우: 가장 빠른 스토리 또는 설정 단계에 배치
   - 관계 → 적절한 스토리 단계의 서비스 계층 작업

4. **설정/인프라에서**:
   - 공유 인프라 → 설정 단계 (1단계)
   - 기본/차단 작업 → 기본 단계 (2단계)
   - 스토리별 설정 → 해당 스토리 단계 내

### 단계 구조

- **1단계**: 설정 (프로젝트 초기화)
- **2단계**: 기본 (차단 전제 조건 - 사용자 스토리 전에 완료해야 함)
- **3단계+**: 우선순위 순서의 사용자 스토리 (P1, P2, P3...)
  - 각 스토리 내: 테스트(요청된 경우) → 모델 → 서비스 → 엔드포인트 → 통합
  - 각 단계는 완전하고 독립적으로 테스트 가능한 증분이어야 합니다.
- **최종 단계**: 다듬기 및 교차 관심사
"""
