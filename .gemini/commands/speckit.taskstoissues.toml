description = "사용 가능한 설계 산출물을 기반으로 기존 작업을 기능에 대한 실행 가능하고 종속성 순서가 지정된 GitHub 이슈로 변환합니다."

prompt = """
---
description: 사용 가능한 설계 산출물을 기반으로 기존 작업을 기능에 대한 실행 가능하고 종속성 순서가 지정된 GitHub 이슈로 변환합니다.
tools: ['github/github-mcp-server/issue_write']
---

## 사용자 입력

```text
$ARGUMENTS
```

진행하기 전에 사용자 입력을 **반드시** 고려해야 합니다(비어 있지 않은 경우).

## 개요

1. 리포지토리 루트에서 `.specify/scripts/bash/check-prerequisites.sh --json --require-tasks --include-tasks` (또는 Windows의 경우 `.specify/scripts/powershell/check-prerequisites.ps1 -Json -RequireTasks -IncludeTasks`)를 실행하고 FEATURE_DIR 및 AVAILABLE_DOCS 목록을 파싱합니다. 모든 경로는 절대 경로여야 합니다. "I'm Groot"와 같은 인수의 작은따옴표는 이스케이프 구문을 사용하세요: 예: 'I'\\''m Groot' (또는 가능한 경우 큰따옴표: "I'm Groot").
1. 실행된 스크립트에서 **tasks** 경로를 추출합니다.
1. 다음을 실행하여 Git 원격을 가져옵니다:

```bash
git config --get remote.origin.url
```

> [!CAUTION]
> 원격이 GITHUB URL인 경우에만 다음 단계로 진행하십시오

1. 목록의 각 작업에 대해 GitHub MCP 서버를 사용하여 Git 원격을 나타내는 리포지토리에 새 이슈를 생성합니다.

> [!CAUTION]
> 원격 URL과 일치하지 않는 리포지토리에는 어떤 상황에서도 이슈를 생성하지 마십시오
"""
