description = "작업 생성 후 spec.md, plan.md, tasks.md 전반에 걸쳐 비파괴적인 교차 산출물 일관성 및 품질 분석을 수행합니다."

prompt = """
---
description: 작업 생성 후 spec.md, plan.md, tasks.md 전반에 걸쳐 비파괴적인 교차 산출물 일관성 및 품질 분석을 수행합니다.
---

## 사용자 입력

```text
$ARGUMENTS
```

진행하기 전에 사용자 입력을 **반드시** 고려해야 합니다(비어 있지 않은 경우).

## 목표

구현 전에 세 가지 핵심 산출물(`spec.md`, `plan.md`, `tasks.md`) 전반에 걸쳐 불일치, 중복, 모호성 및 과소 지정된 항목을 식별합니다. 이 명령은 `/speckit.tasks`가 완전한 `tasks.md`를 성공적으로 생성한 후에만 실행해야 합니다.

## 운영 제약 사항

**엄격한 읽기 전용**: 파일을 수정하지 **마십시오**. 구조화된 분석 보고서를 출력합니다. 선택적 수정 계획을 제안합니다(사용자가 수동으로 후속 편집 명령을 호출하기 전에 명시적으로 승인해야 함).

**헌법 권한**: 프로젝트 헌법(`.specify/memory/constitution.md`)은 이 분석 범위 내에서 **협상 불가능**합니다. 헌법 충돌은 자동으로 치명적(CRITICAL)이며 원칙을 희석, 재해석 또는 조용히 무시하는 것이 아니라 사양, 계획 또는 작업을 조정해야 합니다. 원칙 자체를 변경해야 하는 경우 `/speckit.analyze` 외부에서 별도의 명시적인 헌법 업데이트로 발생해야 합니다.

## 실행 단계

### 1. 분석 컨텍스트 초기화

리포지토리 루트에서 `.specify/scripts/bash/check-prerequisites.sh --json --require-tasks --include-tasks` (또는 Windows의 경우 `.specify/scripts/powershell/check-prerequisites.ps1 -Json -RequireTasks -IncludeTasks`)를 한 번 실행하고 FEATURE_DIR 및 AVAILABLE_DOCS에 대한 JSON을 파싱합니다. 절대 경로 파생:

- SPEC = FEATURE_DIR/spec.md
- PLAN = FEATURE_DIR/plan.md
- TASKS = FEATURE_DIR/tasks.md

필수 파일이 누락된 경우 오류 메시지와 함께 중단합니다(사용자에게 누락된 전제 조건 명령을 실행하도록 지시).
"I'm Groot"와 같은 인수의 작은따옴표는 이스케이프 구문을 사용하세요: 예: 'I'\\''m Groot' (또는 가능한 경우 큰따옴표: "I'm Groot").

### 2. 산출물 로드 (점진적 공개)

각 산출물에서 필요한 최소한의 컨텍스트만 로드합니다:

**spec.md에서:**

- 개요/컨텍스트
- 기능 요구 사항
- 비기능 요구 사항
- 사용자 스토리
- 엣지 케이스 (있는 경우)

**plan.md에서:**

- 아키텍처/스택 선택
- 데이터 모델 참조
- 단계
- 기술적 제약 사항

**tasks.md에서:**

- 작업 ID
- 설명
- 단계 그룹화
- 병렬 마커 [P]
- 참조된 파일 경로

**헌법에서:**

- 원칙 검증을 위해 `.specify/memory/constitution.md` 로드

### 3. 의미론적 모델 구축

내부 표현 생성 (출력에 원시 산출물 포함하지 않음):

- **요구 사항 인벤토리**: 안정적인 키가 있는 각 기능 + 비기능 요구 사항 (명령형 구문 기반 슬러그 파생; 예: "사용자가 파일을 업로드할 수 있음" → `user-can-upload-file`)
- **사용자 스토리/작업 인벤토리**: 인수 기준이 있는 개별 사용자 작업
- **작업 커버리지 매핑**: 각 작업을 하나 이상의 요구 사항 또는 스토리에 매핑 (키워드/ID 또는 핵심 문구와 같은 명시적 참조 패턴에 의한 추론)
- **헌법 규칙 세트**: 원칙 이름 및 MUST/SHOULD 규범적 진술 추출

### 4. 감지 패스 (토큰 효율적 분석)

높은 신호 결과에 집중합니다. 총 50개 결과로 제한하고 나머지는 오버플로 요약에 집계합니다.

#### A. 중복 감지

- 거의 중복되는 요구 사항 식별
- 통합을 위해 품질이 낮은 문구 표시

#### B. 모호성 감지

- 측정 가능한 기준이 없는 모호한 형용사(빠른, 확장 가능한, 안전한, 직관적인, 견고한) 플래그 지정
- 해결되지 않은 자리 표시자(TODO, TKTK, ???, `<placeholder>` 등) 플래그 지정

#### C. 과소 지정

- 동사는 있지만 목적어 또는 측정 가능한 결과가 누락된 요구 사항
- 인수 기준 정렬이 누락된 사용자 스토리
- 사양/계획에 정의되지 않은 파일 또는 구성 요소를 참조하는 작업

#### D. 헌법 정렬

- MUST 원칙과 충돌하는 요구 사항 또는 계획 요소
- 헌법에서 누락된 필수 섹션 또는 품질 게이트

#### E. 커버리지 격차

- 관련 작업이 0개인 요구 사항
- 매핑된 요구 사항/스토리가 없는 작업
- 작업에 반영되지 않은 비기능 요구 사항 (예: 성능, 보안)

#### F. 불일치

- 용어 드리프트 (파일 간에 다르게 명명된 동일한 개념)
- 계획에서 참조되지만 사양에 없는 데이터 엔티티 (또는 그 반대)
- 작업 순서 모순 (예: 종속성 메모 없이 기본 설정 작업 전 통합 작업)
- 충돌하는 요구 사항 (예: 하나는 Next.js를 요구하고 다른 하나는 Vue를 지정)

### 5. 심각도 할당

이 휴리스틱을 사용하여 결과의 우선순위를 지정합니다:

- **CRITICAL**: 헌법 MUST 위반, 핵심 사양 산출물 누락 또는 기본 기능을 차단하는 커버리지 0인 요구 사항
- **HIGH**: 중복되거나 충돌하는 요구 사항, 모호한 보안/성능 속성, 테스트할 수 없는 인수 기준
- **MEDIUM**: 용어 드리프트, 누락된 비기능 작업 커버리지, 과소 지정된 엣지 케이스
- **LOW**: 스타일/문구 개선, 실행 순서에 영향을 미치지 않는 사소한 중복

### 6. 간결한 분석 보고서 생성

다음 구조로 마크다운 보고서(파일 쓰기 없음)를 출력합니다:

## 사양 분석 보고서

| ID | 범주 | 심각도 | 위치 | 요약 | 권장 사항 |
|----|------|--------|------|------|-----------|
| A1 | 중복 | HIGH | spec.md:L120-134 | 두 가지 유사한 요구 사항 ... | 문구 병합; 더 명확한 버전 유지 |

(결과당 한 행 추가; 범주 이니셜 접두사가 있는 안정적인 ID 생성.)

**커버리지 요약 표:**

| 요구 사항 키 | 작업 있음? | 작업 ID | 비고 |
|--------------|------------|---------|------|

**헌법 정렬 문제:** (있는 경우)

**매핑되지 않은 작업:** (있는 경우)

**지표:**

- 총 요구 사항
- 총 작업
- 커버리지 % (작업이 1개 이상인 요구 사항)
- 모호성 수
- 중복 수
- 치명적 문제 수

### 7. 다음 조치 제공

보고서 끝에 간결한 다음 조치 블록 출력:

- CRITICAL 문제가 존재하는 경우: `/speckit.implement` 전에 해결 권장
- LOW/MEDIUM만 있는 경우: 사용자가 진행할 수 있지만 개선 제안 제공
- 명시적 명령 제안 제공: 예: "수정과 함께 /speckit.specify 실행", "아키텍처 조정을 위해 /speckit.plan 실행", "'performance-metrics'에 대한 커버리지를 추가하기 위해 tasks.md 수동 편집"

### 8. 수정 제안

사용자에게 질문: "상위 N개 문제에 대한 구체적인 수정 편집을 제안하시겠습니까?" (자동으로 적용하지 마십시오.)

## 운영 원칙

### 컨텍스트 효율성

- **최소한의 높은 신호 토큰**: 철저한 문서화가 아닌 실행 가능한 결과에 집중
- **점진적 공개**: 산출물을 점진적으로 로드; 모든 콘텐츠를 분석에 덤프하지 않음
- **토큰 효율적 출력**: 결과 표를 50행으로 제한; 오버플로 요약
- **결정론적 결과**: 변경 없이 다시 실행하면 일관된 ID와 카운트가 생성되어야 함

### 분석 지침

- **파일을 수정하지 마십시오** (이것은 읽기 전용 분석입니다)
- **누락된 섹션을 환각하지 마십시오** (없는 경우 정확하게 보고)
- **헌법 위반 우선순위 지정** (이것은 항상 CRITICAL입니다)
- **철저한 규칙보다 예시 사용** (일반적인 패턴이 아닌 특정 인스턴스 인용)
- **0개의 문제를 우아하게 보고** (커버리지 통계와 함께 성공 보고서 방출)

## 컨텍스트

