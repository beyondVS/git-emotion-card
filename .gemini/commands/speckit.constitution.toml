description = "대화형 또는 제공된 원칙 입력을 통해 프로젝트 헌법을 생성하거나 업데이트하여 모든 종속 템플릿이 동기화되도록 합니다."

prompt = """
---
description: 대화형 또는 제공된 원칙 입력을 통해 프로젝트 헌법을 생성하거나 업데이트하여 모든 종속 템플릿이 동기화되도록 합니다.
handoffs: 
  - label: 사양 구축
    agent: speckit.specify
    prompt: 업데이트된 헌법을 기반으로 기능 사양을 구현합니다. 저는...
---

## 사용자 입력

```text
$ARGUMENTS
```

진행하기 전에 사용자 입력을 **반드시** 고려해야 합니다(비어 있지 않은 경우).

## 개요

당신은 `.specify/memory/constitution.md`에서 프로젝트 헌법을 업데이트하고 있습니다. 이 파일은 대괄호 안에 자리 표시자 토큰(예: `[PROJECT_NAME]`, `[PRINCIPLE_1_NAME]`)이 포함된 템플릿입니다. 당신의 임무는 (a) 구체적인 값을 수집/도출하고, (b) 템플릿을 정확하게 채우고, (c) 종속 산출물 전반에 걸쳐 수정 사항을 전파하는 것입니다.

다음 실행 흐름을 따르십시오:

1. `.specify/memory/constitution.md`에서 기존 헌법 템플릿을 로드합니다.
   - `[ALL_CAPS_IDENTIFIER]` 형식의 모든 자리 표시자 토큰을 식별합니다.
   **중요**: 사용자는 템플릿에 사용된 것보다 적거나 많은 원칙을 요구할 수 있습니다. 숫자가 지정되면 존중하십시오 - 일반 템플릿을 따르십시오. 그에 따라 문서를 업데이트합니다.

2. 자리 표시자에 대한 값 수집/도출:
   - 사용자 입력(대화)이 값을 제공하면 사용합니다.
   - 그렇지 않으면 기존 리포지토리 컨텍스트(README, 문서, 포함된 경우 이전 헌법 버전)에서 추론합니다.
   - 거버넌스 날짜의 경우: `RATIFICATION_DATE`는 원래 채택 날짜(알 수 없는 경우 질문하거나 TODO 표시), `LAST_AMENDED_DATE`는 변경된 경우 오늘, 그렇지 않으면 이전 날짜 유지.
   - `CONSTITUTION_VERSION`은 시맨틱 버전 관리 규칙에 따라 증가해야 합니다:
     - MAJOR: 하위 호환되지 않는 거버넌스/원칙 제거 또는 재정의.
     - MINOR: 새로운 원칙/섹션 추가 또는 실질적으로 확장된 지침.
     - PATCH: 명확화, 문구, 오타 수정, 비의미적 개선.
   - 버전 범프 유형이 모호한 경우 확정하기 전에 근거를 제안합니다.

3. 업데이트된 헌법 내용 초안 작성:
   - 모든 자리 표시자를 구체적인 텍스트로 바꿉니다(프로젝트가 아직 정의하지 않기로 선택한 의도적으로 유지된 템플릿 슬롯을 제외하고 대괄호 토큰이 남지 않음 - 남은 것은 명시적으로 정당화).
   - 제목 계층 구조를 보존하고 주석은 명확한 지침을 추가하지 않는 한 교체 후 제거할 수 있습니다.
   - 각 원칙 섹션 확인: 간결한 이름 줄, 협상 불가능한 규칙을 캡처하는 단락(또는 글머리 기호 목록), 명확하지 않은 경우 명시적 근거.
   - 거버넌스 섹션에 수정 절차, 버전 관리 정책 및 규정 준수 검토 기대치가 나열되어 있는지 확인합니다.

4. 일관성 전파 체크리스트 (이전 체크리스트를 활성 검증으로 변환):
   - `.specify/templates/plan-template.md`를 읽고 "헌법 확인" 또는 규칙이 업데이트된 원칙과 일치하는지 확인합니다.
   - 범위/요구 사항 정렬을 위해 `.specify/templates/spec-template.md`를 읽습니다. 헌법이 필수 섹션이나 제약 조건을 추가/제거하는 경우 업데이트합니다.
   - `.specify/templates/tasks-template.md`를 읽고 작업 분류가 새로운 또는 제거된 원칙 기반 작업 유형(예: 관찰 가능성, 버전 관리, 테스트 규율)을 반영하는지 확인합니다.
   - `.specify/templates/commands/*.md`의 각 명령 파일(이 파일 포함)을 읽어 일반적인 지침이 필요할 때 오래된 참조(CLAUDE와 같은 에이전트별 이름)가 남아 있지 않은지 확인합니다.
   - 런타임 지침 문서(예: `README.md`, `docs/quickstart.md` 또는 존재하는 경우 에이전트별 지침 파일)를 읽습니다. 변경된 원칙에 대한 참조를 업데이트합니다.

5. 동기화 영향 보고서 생성 (업데이트 후 헌법 파일 상단에 HTML 주석으로 추가):
   - 버전 변경: 이전 → 신규
   - 수정된 원칙 목록 (이름이 변경된 경우 이전 제목 → 새 제목)
   - 추가된 섹션
   - 제거된 섹션
   - 업데이트가 필요한 템플릿 (✅ 업데이트됨 / ⚠ 보류 중) 및 파일 경로
   - 자리 표시자가 의도적으로 연기된 경우 후속 TODO.

6. 최종 출력 전 검증:
   - 설명되지 않은 대괄호 토큰이 남아 있지 않음.
   - 버전 라인이 보고서와 일치함.
   - 날짜 ISO 형식 YYYY-MM-DD.
   - 원칙은 선언적이고 테스트 가능하며 모호한 언어가 없음("해야 한다" → 적절한 경우 MUST/SHOULD 근거로 대체).

7. 완료된 헌법을 `.specify/memory/constitution.md`에 다시 씁니다(덮어쓰기).

8. 사용자에게 최종 요약 출력:
   - 새 버전 및 범프 근거.
   - 수동 후속 조치를 위해 플래그가 지정된 파일.
   - 제안된 커밋 메시지 (예: `docs: amend constitution to vX.Y.Z (principle additions + governance update)`).

서식 및 스타일 요구 사항:

- 템플릿과 정확히 동일하게 Markdown 제목을 사용하십시오(수준을 강등/승격하지 마십시오).
- 가독성을 유지하기 위해 긴 근거 줄을 줄 바꿈하지만(이상적으로 100자 미만) 어색한 줄 바꿈으로 강제하지 마십시오.
- 섹션 사이에 빈 줄을 하나 유지하십시오.
- 후행 공백을 피하십시오.

사용자가 부분 업데이트(예: 하나의 원칙 수정만)를 제공하는 경우에도 검증 및 버전 결정 단계를 수행하십시오.

중요 정보가 누락된 경우(예: 비준 날짜를 정말 알 수 없음) `TODO(<FIELD_NAME>): 설명`을 삽입하고 연기된 항목 아래의 동기화 영향 보고서에 포함하십시오.

새 템플릿을 생성하지 마십시오. 항상 기존 `.specify/memory/constitution.md` 파일에서 작업하십시오.
"""
