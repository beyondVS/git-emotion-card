description = "계획 템플릿을 사용하여 구현 계획 워크플로우를 실행하고 설계 산출물을 생성합니다."

prompt = """
---
description: 계획 템플릿을 사용하여 구현 계획 워크플로우를 실행하고 설계 산출물을 생성합니다.
handoffs: 
  - label: 작업 생성
    agent: speckit.tasks
    prompt: 계획을 작업으로 분할
    send: true
  - label: 체크리스트 생성
    agent: speckit.checklist
    prompt: 다음 도메인에 대한 체크리스트 생성...
---

## 사용자 입력

```text
$ARGUMENTS
```

진행하기 전에 사용자 입력을 **반드시** 고려해야 합니다(비어 있지 않은 경우).

## 개요

1. **설정**: 리포지토리 루트에서 `.specify/scripts/bash/setup-plan.sh --json` (또는 Windows의 경우 `.specify/scripts/powershell/setup-plan.ps1 -Json`)을 실행하고 JSON을 파싱하여 FEATURE_SPEC, IMPL_PLAN, SPECS_DIR, BRANCH를 가져옵니다. "I'm Groot"와 같은 인수의 작은따옴표는 이스케이프 구문을 사용하세요: 예: 'I'\\''m Groot' (또는 가능한 경우 큰따옴표: "I'm Groot").

2. **컨텍스트 로드**: FEATURE_SPEC 및 `.specify/memory/constitution.md`를 읽습니다. IMPL_PLAN 템플릿(이미 복사됨)을 로드합니다.

3. **계획 워크플로우 실행**: IMPL_PLAN 템플릿의 구조에 따라 다음을 수행합니다:
   - 기술적 컨텍스트 작성 (알 수 없는 사항은 "NEEDS CLARIFICATION"으로 표시)
   - 헌법(constitution)에서 헌법 확인 섹션 작성
   - 게이트 평가 (위반 사항이 정당화되지 않으면 ERROR)
   - 0단계: research.md 생성 (모든 NEEDS CLARIFICATION 해결)
   - 1단계: data-model.md, contracts/, quickstart.md 생성
   - 1단계: 에이전트 스크립트를 실행하여 에이전트 컨텍스트 업데이트
   - 설계 후 헌법 확인 재평가

4. **중지 및 보고**: 2단계 계획 후 명령이 종료됩니다. 브랜치, IMPL_PLAN 경로 및 생성된 산출물을 보고합니다.

## 단계

### 0단계: 개요 및 조사

1. **위의 기술적 컨텍스트에서 알 수 없는 사항 추출**:
   - 각 NEEDS CLARIFICATION → 조사 작업
   - 각 종속성 → 모범 사례 작업
   - 각 통합 → 패턴 작업

2. **조사 에이전트 생성 및 발송**:

   ```text
   기술적 컨텍스트의 각 알 수 없는 사항에 대해:
     작업: "{기능 컨텍스트}에 대한 {unknown} 조사"
   각 기술 선택에 대해:
     작업: "{도메인}에서 {tech}에 대한 모범 사례 찾기"
   ```

3. **`research.md`에 결과 통합** (다음 형식 사용):
   - 결정: [선택된 것]
   - 근거: [선택 이유]
   - 고려된 대안: [평가된 다른 것]

**출력**: 모든 NEEDS CLARIFICATION이 해결된 research.md

### 1단계: 설계 및 계약

**전제 조건:** `research.md` 완료

1. **기능 명세서에서 엔티티 추출** → `data-model.md`:
   - 엔티티 이름, 필드, 관계
   - 요구 사항의 유효성 검사 규칙
   - 해당되는 경우 상태 전환

2. **기능 요구 사항에서 API 계약 생성**:
   - 각 사용자 작업 → 엔드포인트
   - 표준 REST/GraphQL 패턴 사용
   - `/contracts/`에 OpenAPI/GraphQL 스키마 출력

3. **에이전트 컨텍스트 업데이트**:
   - `.specify/scripts/bash/update-agent-context.sh gemini` (또는 Windows의 경우 `.specify/scripts/powershell/update-agent-context.ps1 -Agent gemini`) 실행
   - 이 스크립트는 사용 중인 AI 에이전트를 감지합니다.
   - 적절한 에이전트별 컨텍스트 파일을 업데이트합니다.
   - 현재 계획의 새로운 기술만 추가합니다.
   - 마커 사이의 수동 추가 사항을 보존합니다.

**출력**: data-model.md, /contracts/*, quickstart.md, 에이전트별 파일

## 주요 규칙

- 절대 경로 사용
- 게이트 실패 또는 해결되지 않은 명확화 사항에 대해 ERROR
"""
