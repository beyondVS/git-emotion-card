openapi: 3.0.3
info:
  title: Git Emotion Card API
  version: 1.0.0
  description: GitHub 활동 기반 페르소나 카드 생성 서비스
paths:
  /card.svg:
    get:
      summary: 감정 카드 조회
      description: |
        사용자의 GitHub ID를 받아 최근 활동을 분석한 SVG 카드를 반환합니다.
        - 데이터가 없으면(Cold Miss): 분석 시작 후 "Analyzing" 카드 반환.
        - 데이터가 있으면(Hit): 최신 카드 반환. (오래된 경우 백그라운드 갱신)
      parameters:
        - name: username
          in: query
          description: GitHub 사용자 ID
          required: true
          schema:
            type: string
            example: "torvalds"
      responses:
        '200':
          description: SVG 카드 이미지
          headers:
            Cache-Control:
              schema:
                type: string
                example: "no-cache, no-store, must-revalidate"
            Content-Type:
              schema:
                type: string
                example: "image/svg+xml"
          content:
            image/svg+xml:
              schema:
                type: string
                format: binary
        '400':
          description: 잘못된 요청 (username 누락 등)
          content:
            text/plain:
              schema:
                type: string
                example: "Username is required"
        '500':
          description: 서버 내부 오류 (Fallback 카드 반환 가능)